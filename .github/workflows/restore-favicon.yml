name: Restore favicon

on:
  push:
    paths:
      - '.github/workflows/restore-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write valid favicon.ico and cleanup
        run: |
          set -euo pipefail
          mkdir -p src/app
          # Minimal valid 16x16 ICO (PNG-compressed). Original was double-base64-corrupted via MCP.
          echo 'AAABAAEAEBAAAAEAIABSAAAAFgAAAIlQTkcNChoKAAAADUlIRFIAAAAQAAAAEAgGAAAAH/P/YQAAABlJREFUeNpjkHNY/58SzDBqwKgBowYMFwMAGVkMH2N3gncAAAAASUVORK5CYII=' | base64 -d > src/app/favicon.ico
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/favicon.ico')
          data = p.read_bytes()
          assert data[:4] == b'\x00\x00\x01\x00', data[:8]
          print('favicon bytes', len(data))
          PY
          rm -f .github/pages-trigger.md
          rm -rf .lock-parts
          rm -f .github/workflows/restore-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add remaining source files"
          git push
