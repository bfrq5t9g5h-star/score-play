name: Commit workspace package-lock

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commit-lockfile.yml'

permissions:
  contents: write

jobs:
  commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove helper files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('package-lock.json')
          json.load(p.open())
          print('lockfile bytes', p.stat().st_size)
          PY
          rm -rf .lock-parts
          rm -f .github/workflows/commit-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json .lock-parts .github/workflows/commit-lockfile.yml
          git status
          git commit -m "Add remaining source files"
          git push
